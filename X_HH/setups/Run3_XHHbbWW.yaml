# X->HH->bbWW resonant signal (narrow radion, spin 0): SL + DL, 22 mass points each.
#
# ONE setup for every era it produces: `events_total` is given per era, so no per-era copy of this
# file is needed. Central production covers only Run3_2022 / Run3_2022EE; the counts below fill the
# gap, starting from the central per-mass statistics scaled by integrated luminosity,
#   N(era) = (N_2022 + N_2022EE) / 34664 pb-1 * L(era),
# with L = 17964 pb-1 (2023), 9677 pb-1 (2023BPix) and 246522 pb-1 (2024, which covers the shared
# Summer24 MC of 2024 + 2025 + 2026).
#
# The result is then UNIFIED over the mass points, in two groups (M <= 1000 GeV and M > 1000 GeV,
# the step the central statistics themselves take): every point of a group gets that group's
# largest value, rounded up to a multiple of 10k. So the samples of a group are directly
# comparable and no point ends up below its luminosity-scaled target:
#
#              era            M <= 1000 GeV   M > 1000 GeV
#              Run3_2023           210 000         60 000
#              Run3_2023BPix       120 000         30 000
#              Run3_2024         2 850 000        720 000
#
# Both final states get the same numbers: their group maxima differed by a single rounding step.
# Totals: 6.54 M (2023) + 3.66 M (2023BPix) + 87.06 M (2024) = 97.26 M events.
#
# Backend-agnostic: run with --workflow local|htcondor|crab. Produce a subset with
# `--points '<glob>'` and a short check with `--test <n-events>`; neither needs another setup.
process: X_HH
conditions: config/conditions_Run3.yaml

# product directory under fs_default; FLAF consumes
# <fs_default>/<output>/nanoAOD_<version>/<era>/<point>/nano_<version>_<n>.root
output: XHHbbWW

eras: [ Run3_2023, Run3_2023BPix, Run3_2024 ]

# NanoAOD versions to produce per era (v15-only for 2024)
nano_versions:
  Run3_2023: [ v12, v15 ]
  Run3_2023BPix: [ v12, v15 ]
  Run3_2024: [ v15 ]

first_step: LHEGS
last_step: NANO

events_per_job: 2000
files_per_merge: 25

# default production mode for every point below (a point may override it)
production_mode: GluGlutoRadion

# Points are named exactly as the corresponding central datasets on DAS, and so are the two tokens
# a point sets: `production_mode` (the cards, here the setup-wide default GluGlutoRadion) and
# `final_state` (the gen fragment that decays the HH pair, models/X_HH/.../fragments/<final_state>.py).
# The gridpack is shared by both final states.
points:
  # ---- single lepton ----
  - name: GluGlutoRadiontoHHto2B2Vto2B2JLNu_M-250
    mass: 250
    spin: 0
    final_state: 2B2JLNu
    events_total:
      Run3_2023: 210000
      Run3_2023BPix: 120000
      Run3_2024: 2850000
  - name: GluGlutoRadiontoHHto2B2Vto2B2JLNu_M-260
