# X->HH->bbWW resonant signal: both spin hypotheses (narrow radion, spin 0, and bulk graviton,
# spin 2), SL + DL, the full 40-mass central grid each -- 160 points.
#
# ONE setup for every era it produces: `events_total` is given per era, so no per-era copy of this
# file is needed. The counts start from the central per-mass statistics for 2022 + 2022EE, scaled
# by integrated luminosity,
#   N(era) = (N_2022 + N_2022EE) / 34664.43 pb-1 * L(era),
# with L taken from FLAF's `config/<era>/global.yaml`: 7989.51 pb-1 (2022), 26674.92 (2022EE),
# 17964.22 (2023), 9676.74 (2023BPix) and 246522 (2024, which covers the shared Summer24 MC of
# 2024 + 2025 + 2026). The reference is 400 k (M <= 1000 GeV) and 100 k (M > 1000 GeV), the sum of
# what central produced for the two 2022 eras (verified on DAS, e.g. M-250: 87 999 in Run3Summer22
# and 310 599 in Run3Summer22EE; M-1200: 22 000 and 78 000).
#
# The result is then UNIFIED over the mass points, in two groups (M <= 1000 GeV and M > 1000 GeV,
# the step the central statistics themselves take): every point of a group gets that group's
# largest value, rounded up to a whole number of merged files (50 000 events, see
# `events_per_job` x `files_per_merge` below). So the samples of a group are directly comparable,
# no point ends up below its luminosity-scaled target, and every merged file is full:
#
#              era            M <= 1000 GeV   M > 1000 GeV
#              Run3_2022           100 000         50 000
#              Run3_2022EE         350 000        100 000
#              Run3_2023           250 000        100 000
#              Run3_2023BPix       150 000         50 000
#              Run3_2024         2 850 000        750 000
#
# EVERY POINT LISTS EVERY ERA -- the setup describes the full grid, and what a given run actually
# produces is chosen on the command line. That matters for the 2022 eras: central production
# already delivers 22 of the 40 masses there (verified on DAS, Run3Summer22*NanoAODv12: the same
# 22 masses for BOTH spins and BOTH final states), so a 2022 run is restricted with `--points` to
# the 18 masses central lacks -- 320, 360, 400, 500, 750, 850, 900, 1100, 1300, 1500, 1700, 1900,
# 2200, 2400, 2600, 2800, 3500, 4500. Central has NOTHING for 2023/2023BPix/2024 (verified: zero
# Run3Summer23* and Run3Summer23BPix* datasets), so those run the whole grid.
#
# The ready-made per-era commands are in the model README, next to this file's description.
#
# Both final states get the same numbers: their group maxima differed by a single rounding step,
# and both production modes get the same numbers as each other, since the statistics follow from
# the mass and the era, not from the spin.
#
# The mass grid is the full central one: all 40 points cvmfs carries a gridpack for, at both spins
# (GF_HH_Spin0/Radion_hh_narrow_M* and GF_HH_Spin2/BulkGraviton_hh_GF_HH_narrow_M*), every one of
# them mirrored in DSProdGridpacks -- so nothing here needs MakeGridpack.
#
# Totals as submitted with the documented commands (2022 eras restricted to the 18-mass gap):
# 5.00 M (2022) + 14.20 M (2022EE) + 28.00 M (2023) + 16.00 M (2023BPix) + 288.00 M (2024)
# = 351.20 M events, i.e. 26 + 75 + 148 + 85 GB for the 2022/2023 eras and 1942 GB for 2024,
# 2.28 TB in total. Running the 2022 eras over the whole grid instead would add 29.0 M events.
#
# Backend-agnostic: run with --workflow local|htcondor|crab. Produce a subset with
# `--points '<glob>'` and a short check with `--test <n-events>`; neither needs another setup.
process: X_HH
conditions: config/conditions_Run3.yaml

# product directory under fs_default; FLAF consumes
# <fs_default>/<output>/nanoAOD_<version>/<era>/<point>/nano_<version>_<n>.root
output: XHHbbWW

eras: [ Run3_2022, Run3_2022EE, Run3_2023, Run3_2023BPix, Run3_2024 ]

# NanoAOD versions per era. Each version is a full second copy of the era's events -- measured on
# delivered files, 5.29 kB/event in v12 and 6.74 in v15 -- so the 2022/2023 eras produce v12 only,
# matching the version central production delivers for them. 2024 is v15, as its campaign is.
# `--nano-versions` narrows this further for one run without editing the file.
nano_versions:
  Run3_2022: [ v12 ]
  Run3_2022EE: [ v12 ]
  Run3_2023: [ v12 ]
  Run3_2023BPix: [ v12 ]
  Run3_2024: [ v15 ]

first_step: LHEGS
last_step: NANO

# One production job makes `events_per_job` events; `files_per_merge` of those are then merged
# into one FLAF-facing file, so a merged file holds 50 x 1000 = 50 000 events: 0.26 GB in v12 and
# 0.34 GB in v15, measured on delivered files (5.29 and 6.74 kB/event -- central NanoAOD on DAS
# shows 2.9 kB/event, which under-counts these by ~1.8x). That is well under the ~1 GB the
# HLepRare skims use, deliberately: a round 50 k per file keeps every `events_total` an exact
# number of files, so a later top-up production is just "add N more files" with nothing to
# reconcile. DSProd refuses a setup whose `events_total` is not a multiple of this product.
events_per_job: 1000
files_per_merge: 50

# default production mode for every point below; the spin-2 points override it with
# `production_mode: GluGlutoBulkGraviton`
production_mode: GluGlutoRadion

# Points are named exactly as the corresponding central datasets on DAS, and so are the two tokens
# a point sets: `production_mode` (the cards, here the setup-wide default GluGlutoRadion) and
# `final_state` (the gen fragment that decays the HH pair, models/X_HH/.../fragments/<final_state>.py).
# The gridpack is shared by both final states.
points:
  # ---- radion (spin 0), single lepton ----
