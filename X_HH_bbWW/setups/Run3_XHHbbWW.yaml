# Production setup: X->HH->bbWW resonant signal, Run3. Backend-agnostic — run with
# --workflow local|htcondor|crab (CRAB site/resource settings live in DSProd config/law.cfg,
# not here). The gridpack location is derived automatically from the DSProdGridpacks store; if a
# point's gridpack is not stored there it is generated.
process: X_HH_bbWW
conditions: config/conditions_Run3.yaml

# output sub-directory under the user's storage area (fs.storage_base in global/user_custom config).
# FLAF consumes <storage_base>/<output>/nanoAOD_<version>/<era>/<process>/<point>/nano_<version>_<n>.root
output: XHHbbWW

eras: [ Run3_2022EE ]

# NanoAOD versions to produce per era (v12+v15 for 22-23BPix; v15-only for 2024)
nano_versions:
  Run3_2022: [ v12, v15 ]
  Run3_2022EE: [ v12, v15 ]
  Run3_2023: [ v12, v15 ]
  Run3_2023BPix: [ v12, v15 ]
  Run3_2024: [ v15 ]

first_step: LHEGS
last_step: NANO

events_per_job: 2000
files_per_merge: 25

points:
  # The current fragment selects the single-lepton channel (2B2JLNu); the gridpack is
  # channel-independent. M-800 is a central mass with a gridpack stored in DSProdGridpacks; a
  # non-central mass (no stored gridpack) is generated automatically.
  - name: GluGlutoRadiontoHHto2B2Vto2B2JLNu_M-800
    mass: 800
    spin: 0
    events_total: 100000
