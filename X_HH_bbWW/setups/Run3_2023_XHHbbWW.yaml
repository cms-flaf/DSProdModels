# X->HH->bbWW resonant signal (narrow radion, spin 0) for Run3_2023: SL + DL, 22 mass points each.
#
# Fills the gap in central production, which covers only Run3_2022 / Run3_2022EE. Event targets
# reproduce the central per-mass statistics scaled by integrated luminosity:
#   N = (N_2022 + N_2022EE) / 34664 pb-1 * 17964 pb-1, rounded to 1k.
# This era covers 2023.
# Backend-agnostic: run with --workflow local|htcondor|crab.
process: X_HH_bbWW
conditions: config/conditions_Run3.yaml

output: XHHbbWW

eras: [ Run3_2023 ]

nano_versions:
  Run3_2023: [ v12, v15 ]

first_step: LHEGS
last_step: NANO

events_per_job: 2000
files_per_merge: 25

